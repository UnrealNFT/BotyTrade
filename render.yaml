services:
  - type: web
    name: botytrade-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PORT
        value: 8080
      - key: PAPER_TRADING
        value: true
      - key: TELEGRAM_CHAT_ID
        value: -1003379273264
      - key: TELEGRAM_AUTHORIZED_USERNAME
        value: djaf77
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: JUPITER_API_URL
        value: https://quote-api.jup.ag/v6
      - key: LOG_LEVEL
        value: INFO
      # Secrets à renseigner manuellement dans le dashboard Render :
      # TELEGRAM_BOT_TOKEN
      # SOLANA_PRIVATE_KEY
      # SOLANA_PUBLIC_KEY
      # SOLANA_RPC_URL (optionnel, si tu utilises Helius)
      # MORALIS_API_KEY
      # GROQ_API_KEY
      # DASHBOARD_URL (URL Netlify finale, ex: https://botytrade.netlify.app/mockup.html)
